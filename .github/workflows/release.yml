name: Release

# Manual only. A run without `publish` checks and packs the release but
# publishes nothing; with it, it also publishes to npm through trusted
# publishing. package.json keeps "private": true until launch, so even a
# mistaken `publish` run fails at `npm publish` (see CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (fails while package.json is private)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teachmehipaa-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: teachmehipaa-mcp
          persist-credentials: false
      # Until @teachmehipaa/node is on npm, install it from its main branch.
      # Switch to `npm ci` at launch (CONTRIBUTING.md, Releasing).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TeachMeHIPAA/teachmehipaa-node
          ref: main
          path: teachmehipaa-node
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the SDK
        working-directory: teachmehipaa-node
        run: npm ci && npm run build
      - run: scripts/use-local-sdk.sh ../teachmehipaa-node
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a short-lived
      # publish credential and signs the provenance statement.
      id-token: write
    defaults:
      run:
        working-directory: teachmehipaa-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: teachmehipaa-mcp
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TeachMeHIPAA/teachmehipaa-node
          ref: main
          path: teachmehipaa-node
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build the SDK
        working-directory: teachmehipaa-node
        run: npm ci && npm run build
      - run: scripts/use-local-sdk.sh ../teachmehipaa-node
      - run: npm run build
      - run: npm publish --provenance --access public
