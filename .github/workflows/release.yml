name: Release

# Manual only. A run without `publish` checks and packs the release but
# publishes nothing; with it, it also publishes to npm through trusted
# publishing, from the `npm` environment (see CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teachmehipaa-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: teachmehipaa-mcp
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Choose the SDK source
        id: sdk
        run: |
          if npm view 'teachmehipaa@^1.0.0' version > /dev/null 2>&1; then
            echo "source=registry" >> "$GITHUB_OUTPUT"
          else
            echo "source=checkout" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sdk.outputs.source == 'checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TeachMeHIPAA/teachmehipaa-node
          ref: main
          path: teachmehipaa-node
          persist-credentials: false
      - name: Build the SDK
        if: steps.sdk.outputs.source == 'checkout'
        working-directory: teachmehipaa-node
        run: npm ci && npm run build
      - name: Install dependencies
        run: |
          if [ "${{ steps.sdk.outputs.source }}" = registry ]; then
            npm install
          else
            scripts/use-local-sdk.sh ../teachmehipaa-node
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    # The npm trusted publisher is pinned to this environment, so only a job
    # that names it can mint a publish credential.
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a short-lived
      # publish credential and signs the provenance statement.
      id-token: write
    defaults:
      run:
        working-directory: teachmehipaa-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: teachmehipaa-mcp
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Choose the SDK source
        id: sdk
        run: |
          if npm view 'teachmehipaa@^1.0.0' version > /dev/null 2>&1; then
            echo "source=registry" >> "$GITHUB_OUTPUT"
          else
            echo "source=checkout" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sdk.outputs.source == 'checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TeachMeHIPAA/teachmehipaa-node
          ref: main
          path: teachmehipaa-node
          persist-credentials: false
      - name: Build the SDK
        if: steps.sdk.outputs.source == 'checkout'
        working-directory: teachmehipaa-node
        run: npm ci && npm run build
      - name: Install dependencies
        run: |
          if [ "${{ steps.sdk.outputs.source }}" = registry ]; then
            npm install
          else
            scripts/use-local-sdk.sh ../teachmehipaa-node
          fi
      - run: npm run build
      - run: npm publish
